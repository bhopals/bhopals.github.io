name: Build and Publish to gh-pages Branch

on:
  push:
    branches: [ main ]
  schedule:
    # Weekly refresh so baked-in GitHub data (stars, descriptions, pinned repos) stays current
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Fetch GitHub data
      run: node scripts/fetch-github-data.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build
      run: npm run build
      env:
         CI: ""

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
          branch: gh-pages
          folder: build
